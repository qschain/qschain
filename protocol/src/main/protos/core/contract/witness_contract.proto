syntax = "proto3";

package protocol;

option java_package = "org.tron.protos.contract"; //Specify the name of the package that generated the Java file
//option java_outer_classname = "WitnessCreateContract"; //Specify the class name of the generated Java file
option go_package = "github.com/tronprotocol/grpc-gateway/core";

message WitnessCreateContract {
  bytes owner_address = 1;
  bytes url = 2;
  int64 credit_score = 3;//consensus
}

message WitnessUpdateContract {
  bytes owner_address = 1;
  bytes update_url = 12;
  //int64 credit_score = 3;//consensus
}

message WitnessCreditUpdateContract{//consensus
  bytes owner_address = 1;
  bytes update_witness = 2;
  int64 update_credit = 3;
}

message VoteWitnessContract {
  message Vote {
    bytes vote_address = 1;
    int64 vote_count = 2;
  }
  bytes owner_address = 1;
  repeated Vote votes = 2;
  bool support = 3;
}